<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทะเบียนมิตรภาพ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; display: flex; flex-direction: column; min-height: 100vh; }
        .main-content { flex: 1; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: none; }
        .sidebar { background: #212529; color: white; min-height: calc(100vh - 56px); }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 15px; display: block; border-radius: 6px; margin-bottom: 5px; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background: #0d6efd; color: white; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 56px; left: -250px; width: 250px; height: 100%; z-index: 1050; transition: left 0.3s ease; }
            .sidebar.show { left: 0; }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">กำลังโหลด...</span>
        </div>
    </div>

    <div id="login-container" class="container d-flex justify-content-center align-items-center main-content">
        <div class="card p-4 shadow" style="width: 100%; max-width: 420px;">
            <h3 class="text-center mb-2 text-primary fw-bold">ทะเบียนมิตรภาพ</h3>
            <p class="text-center text-muted small mb-4">สำนักงานเพื่อส่งเสริมชตินนท์ จากรัมย์</p>
            <div class="mb-3">
                <label class="form-label">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="username" class="form-control" placeholder="กรอกชื่อผู้ใช้">
            </div>
            <div class="mb-3">
                <label class="form-label">รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="form-control" placeholder="กรอกรหัสผ่าน">
            </div>
            <button onclick="handleLogin()" class="btn btn-primary w-100 py-2 fw-bold">เข้าสู่ระบบ</button>
            <div id="login-error" class="text-danger text-center mt-3 small"></div>
        </div>
    </div>

    <div id="app-container" class="main-content" style="display: none;">
        <nav class="navbar navbar-dark bg-dark px-3">
            <div class="container-fluid">
                <button class="btn btn-outline-light btn-sm d-md-none me-2" onclick="toggleSidebar()">☰ เมนู</button>
                <span class="navbar-brand mb-0 h1">ระบบทะเบียนมิตรภาพ</span>
                <span class="text-white small">ผู้ใช้งาน: <span id="nav-username" class="text-warning fw-bold"></span></span>
            </div>
        </nav>

        <div class="container-fluid">
            <div class="row">
                <div id="sidebar-menu" class="col-md-3 col-lg-2 sidebar p-3">
                    <div class="text-center mb-3">
                        <img id="user-avatar" src="" class="rounded-circle img-fluid mb-2 border border-2 border-warning" style="width: 70px; height: 70px; object-fit: cover;">
                        <div id="user-display-name" class="fw-bold"></div>
                        <div id="user-display-role" class="badge bg-secondary mt-1"></div>
                    </div>
                    <hr class="border-secondary">
                    <div id="menu-list"></div>
                    <button onclick="logout()" class="btn btn-outline-danger w-100 mt-4 btn-sm">ออกจากระบบ</button>
                </div>

                <div class="col-md-9 col-lg-10 p-4 main-content">
                    <div id="content-area" class="container" style="max-width: 1000px;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto small">
        <span>สำนักงานเพื่อส่งเสริมชตินนท์ จากรัมย์ &copy; 2026</span>
    </footer>

    <script>
        let currentUser = null;
        let currentProfile = null;

        // ฟังก์ชันส่งคำขอหา Proxy Server บน Render
        async function callGAS(action, payload = {}) {
            const response = await fetch('/api/gas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            return await response.json();
        }

        function normalizeStatus(value) {
            return String(value == null ? '' : value)
                .normalize('NFC')
                .replace(/[\u200B-\u200D\uFEFF]/g, '')
                .replace(/\u00A0/g, ' ')
                .trim();
        }

        function getPendingLogs(logs) {
            return (Array.isArray(logs) ? logs : []).filter(log =>
                normalizeStatus(log && log.สถานะ) === 'รออนุมัติ'
            );
        }

        window.onload = function() {
            let savedUser = localStorage.getItem('chat_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                loadDashboardData();
            } else {
                document.getElementById('login-container').style.setProperty('display', 'flex', 'important');
                document.getElementById('app-container').style.setProperty('display', 'none', 'important');
            }

            // รองรับกดปุ่ม Back/Forward บนเบราว์เซอร์
            window.onpopstate = function() {
                if(currentUser) {
                    let path = window.location.pathname.replace('/', '') || 'home';
                    showPage(path, false);
                }
            };
        };

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function toggleSidebar() {
            document.getElementById('sidebar-menu').classList.toggle('show');
        }

        async function handleLogin() {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            if(!u || !p) {
                document.getElementById('login-error').innerText = "กรุณากรอกข้อมูลให้ครบถ้วน";
                return;
            }
            showLoading(true);
            try {
                const res = await callGAS('login', { username: u, password: p });
                showLoading(false);
                if(res.success) {
                    currentUser = res.user;
                    localStorage.setItem('chat_user', JSON.stringify(currentUser));
                    loadDashboardData();
                } else {
                    document.getElementById('login-error').innerText = res.message;
                }
            } catch(e) {
                showLoading(false);
                document.getElementById('login-error').innerText = "เชื่อมต่อล้มเหลว";
            }
        }

        function logout() {
            localStorage.removeItem('chat_user');
            currentUser = null;
            currentProfile = null;
            window.history.pushState({}, '', '/login');
            document.getElementById('app-container').style.setProperty('display', 'none', 'important');
            document.getElementById('login-container').style.setProperty('display', 'flex', 'important');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function getFormattedDisplayName() {
            if (currentProfile && (currentProfile['คำนำหน้า'] || currentProfile['ชื่อ-นามสกุล'])) {
                let prefix = (currentProfile['คำนำหน้า'] || '').trim();
                let fullName = (currentProfile['ชื่อ-นามสกุล'] || '').trim();
                return prefix ? (prefix + fullName) : fullName;
            }
            return currentUser.fullName || currentUser.username;
        }

        async function loadDashboardData() {
            showLoading(true);
            document.getElementById('login-container').style.setProperty('display', 'none', 'important');
            document.getElementById('app-container').style.setProperty('display', 'block', 'important');

            try {
                const profile = await callGAS('getFullProfile', { userId: currentUser.id });
                showLoading(false);
                currentProfile = profile || {};
                let displayName = getFormattedDisplayName();
                document.getElementById('nav-username').innerText = displayName;
                document.getElementById('user-display-name').innerText = displayName;
                document.getElementById('user-display-role').innerText = currentUser.role;
                document.getElementById('user-avatar').src = currentUser.image || 'https://via.placeholder.com/70';
                setupMenus();
                
                let currentRoute = window.location.pathname.replace('/', '') || 'home';
                showPage(currentRoute, false);
            } catch(e) {
                showLoading(false);
            }
        }

        function setupMenus() {
            let menuHtml = `<a href="/home" onclick="navigate(event, 'home')">หน้าแรก</a>`;
            menuHtml += `<a href="/profile" onclick="navigate(event, 'profile')">โปรไฟล์</a>`;
            menuHtml += `<a href="/history" onclick="navigate(event, 'history')">ประวัติไทม์ไลน์</a>`;
            
            if(currentUser.role === 'เพื่อนในทะเบียนมิตรภาพ') {
                menuHtml += `<a href="/request_rank" onclick="navigate(event, 'request_rank')">ขอยศใหม่</a>`;
            } else if(currentUser.role === 'ผู้ถูกปกป้อง') {
                menuHtml += `<a href="/manage_friends" onclick="navigate(event, 'manage_friends')">จัดการข้อมูลเพื่อน</a>`;
                menuHtml += `<a href="/request_rank" onclick="navigate(event, 'request_rank')">เสนอเลื่อนยศเพื่อน</a>`;
                menuHtml += `<a href="/request_name" onclick="navigate(event, 'request_name')">เสนอเปลี่ยนชื่อ</a>`;
                menuHtml += `<a href="/event_log" onclick="navigate(event, 'event_log')">บันทึกเหตุการณ์</a>`;
            } else if(currentUser.role === 'ผู้อำนวยการ') {
                menuHtml += `<a href="/manage_friends" onclick="navigate(event, 'manage_friends')">จัดการข้อมูลเพื่อน</a>`;
                menuHtml += `<a href="/approve_ranks" onclick="navigate(event, 'approve_ranks')">พิจารณาคำขอเลื่อนยศ</a>`;
                menuHtml += `<a href="/approve_names" onclick="navigate(event, 'approve_names')">พิจารณาคำขอเปลี่ยนชื่อ</a>`;
            }
            document.getElementById('menu-list').innerHTML = menuHtml;
        }

        function navigate(e, page) {
            e.preventDefault();
            showPage(page, true);
        }

        function setActiveMenu(page) {
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar a[href="/${page}"]`);
            if(activeLink) activeLink.classList.add('active');
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar-menu').classList.remove('show');
            }
        }

        async function showPage(page, updateUrl = true) {
            if(updateUrl) {
                window.history.pushState({}, '', `/${page}`);
            }
            setActiveMenu(page);
            let area = document.getElementById('content-area');

            if(page === 'home') {
                let displayName = getFormattedDisplayName();
                area.innerHTML = `
                    <div class="card p-4 bg-white mx-auto" style="max-width: 800px;">
                        <h3 class="text-primary mb-3">ยินดีต้อนรับ, ${displayName}</h3>
                        <p class="text-muted">สำนักงานเพื่อส่งเสริมชตินนท์ จากรัมย์</p>
                        <hr>
                        <div class="row mt-4">
                            <div class="col-md-4 mb-3">
                                <div class="card bg-light p-3 border text-center">
                                    <h5>บทบาทของคุณ</h5>
                                    <p class="fs-6 fw-bold text-success m-0">${currentUser.role}</p>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="card bg-light p-3 border text-center">
                                    <h5>รหัสประจำตัว</h5>
                                    <p class="fs-6 fw-bold text-dark m-0">${currentUser.id}</p>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="card bg-light p-3 border text-center">
                                    <h5>สถานะระบบ</h5>
                                    <p class="fs-6 fw-bold text-primary m-0">ออนไลน์ปกติ</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if(page === 'profile') {
                let displayName = getFormattedDisplayName();
                area.innerHTML = `
                    <div class="card p-4 mx-auto" style="max-width: 600px;">
                        <h3 class="text-primary mb-3 text-center">โปรไฟล์ (จัดการบัญชี)</h3>
                        <p class="text-center text-muted small">แก้ไขเฉพาะชื่อผู้ใช้และรหัสผ่านของคุณ</p>
                        <hr>
                        <div class="mb-3 text-center">
                            <img src="${currentUser.image || 'https://via.placeholder.com/80'}" class="rounded-circle border" style="width: 90px; height: 90px; object-fit: cover;">
                            <h5 class="mt-2">${displayName}</h5>
                            <span class="badge bg-primary">${currentUser.role}</span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ชื่อผู้ใช้ (Username)</label>
                            <input type="text" id="new-username" class="form-control" value="${currentUser.username}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">รหัสผ่านใหม่ (Password)</label>
                            <input type="password" id="new-password" class="form-control" placeholder="ปล่อยว่างหากไม่ต้องการเปลี่ยน">
                        </div>
                        <button onclick="updateAccount()" class="btn btn-success w-100 fw-bold">บันทึกการแก้ไขบัญชี</button>
                    </div>
                `;
            } else if(page === 'history') {
                showLoading(true);
                const rankLogs = await callGAS('getRankLogs');
                const nameLogs = await callGAS('getNameLogs');
                const eventLogs = await callGAS('getEventLogs');
                showLoading(false);

                const loggedInUserId = String(currentUser && currentUser.id != null ? currentUser.id : '').trim();
                const belongsToCurrentUser = log => String(log && log.รหัสประจำตัว != null ? log.รหัสประจำตัว : '').trim() === loggedInUserId;
                
                let filteredRanks = (rankLogs || []).filter(belongsToCurrentUser);
                let filteredNames = (nameLogs || []).filter(belongsToCurrentUser);
                let filteredEvents = (eventLogs || []).filter(belongsToCurrentUser);

                let rankRows = filteredRanks.map(l => `
                    <tr>
                        <td>${l.ลำดับ}</td>
                        <td>${l.รหัสประจำตัว}</td>
                        <td>${l.ยศที่ได้เลื่อน}</td>
                        <td>${l.ครั้งที่เลื่อนยศ}</td>
                        <td>${l.ปีที่เลื่อนยศ}</td>
                        <td>${l.อัปเดตเมื่อ || '-'}</td>
                        <td><span class="badge bg-${l.สถานะ === 'อนุมัติ' ? 'success' : (l.สถานะ === 'ไม่อนุมัติ' ? 'danger' : 'warning')}">${l.สถานะ}</span></td>
                        <td>${l.ผู้เสนอ || '-'} (${l.ตำแหน่งผู้เสนอ || '-'})</td>
                        <td>${l.ผู้พิจารณา || '-'} (${l.ตำแหน่งผู้พิจารณา || '-'})</td>
                        <td>${l.ความคิดเห็นผู้เสนอ || '-'}</td>
                        <td>${l.ความคิดเห็นผู้พิจารณา || '-'}</td>
                    </tr>
                `).join('');

                let nameRows = filteredNames.map(l => `
                    <tr>
                        <td>${l.ลำดับ}</td>
                        <td>${l.รหัสประจำตัว}</td>
                        <td>${l.ชื่อที่ตั้งใหม่}</td>
                        <td>${l.ครั้งที่ตั้งชื่อ}</td>
                        <td>${l.ปีที่ตั้งชื่อ}</td>
                        <td>${l.อัปเดตเมื่อ || '-'}</td>
                        <td><span class="badge bg-${l.สถานะ === 'อนุมัติ' ? 'success' : (l.สถานะ === 'ไม่อนุมัติ' ? 'danger' : 'warning')}">${l.สถานะ}</span></td>
                        <td>${l.ผู้เสนอ || '-'}</td>
                        <td>${l.ผู้พิจารณา || '-'}</td>
                        <td>${l.ความคิดเห็นผู้เสนอ || '-'}</td>
                        <td>${l.ความคิดเห็นผู้พิจารณา || '-'}</td>
                    </tr>
                `).join('');

                let profileInfo = currentProfile;
                let formattedName = getFormattedDisplayName();
                area.innerHTML = `
                    <div class="card p-4 mb-4">
                        <h3 class="text-primary mb-3">ประวัติข้อมูลของคุณ</h3>
                        <div class="row">
                            <div class="col-md-6 mb-2"><strong>รหัสประจำตัว:</strong> ${profileInfo['รหัสประจำตัว'] || '-'}</div>
                            <div class="col-md-6 mb-2"><strong>ชื่อ-นามสกุล:</strong> ${formattedName}</div>
                            <div class="col-md-6 mb-2"><strong>ยศปัจจุบัน:</strong> <span class="text-primary fw-bold">${profileInfo['ยศปัจจุบัน'] || '-'}</span></div>
                        </div>
                    </div>
                    <div class="card p-4 mb-4">
                        <h3 class="text-primary mb-3">ประวัติการเลื่อนยศ</h3>
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped small align-middle">
                                <thead class="table-dark"><tr><th>ลำดับ</th><th>รหัส</th><th>ยศ</th><th>ครั้ง</th><th>ปี</th><th>อัปเดต</th><th>สถานะ</th><th>ผู้เสนอ</th><th>ผู้พิจารณา</th><th>ความเห็นผู้เสนอ</th><th>ความเห็นผู้พิจารณา</th></tr></thead>
                                <tbody>${rankRows || '<tr><td colspan="11" class="text-center">ไม่มีข้อมูล</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card p-4 mb-4">
                        <h3 class="text-primary mb-3">ประวัติการตั้งชื่อ</h3>
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped small align-middle">
                                <thead class="table-dark"><tr><th>ลำดับ</th><th>รหัส</th><th>ชื่อใหม่</th><th>ครั้ง</th><th>ปี</th><th>อัปเดต</th><th>สถานะ</th><th>ผู้เสนอ</th><th>ผู้พิจารณา</th><th>ความเห็นผู้เสนอ</th><th>ความเห็นผู้พิจารณา</th></tr></thead>
                                <tbody>${nameRows || '<tr><td colspan="11" class="text-center">ไม่มีข้อมูล</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if(page === 'approve_ranks') {
                showLoading(true);
                const logs = await callGAS('getRankLogs');
                const ranks = await callGAS('getAllRanks');
                showLoading(false);

                let rankOpts = (ranks || []).map(r => `<option value="${r.ชื่อยศ}">${r.ชื่อยศ}</option>`).join('');
                let pending = getPendingLogs(logs);
                let rows = pending.map(l => `
                    <tr>
                        <td>${l.รหัสประจำตัว}</td>
                        <td><span class="fw-bold text-primary">${l.ยศที่ได้เลื่อน}</span></td>
                        <td>${l.ผู้เสนอ || '-'} (${l.ตำแหน่งผู้เสนอ || '-'})<br><small class="text-muted">เหตุผล: ${l.ความคิดเห็นผู้เสนอ || '-'}</small></td>
                        <td>
                            <select id="new-rank-${l.rowIdx}" class="form-select form-select-sm mb-1">${rankOpts}</select>
                            <input type="text" id="comment-${l.rowIdx}" class="form-control form-control-sm mb-1" placeholder="ความคิดเห็นผู้อำนวยการ">
                            <button class="btn btn-sm btn-success fw-bold me-1" onclick="processRank(${l.rowIdx}, 'อนุมัติ', '${l.รหัสประจำตัว}')">อนุมัติ</button>
                            <button class="btn btn-sm btn-danger fw-bold" onclick="processRank(${l.rowIdx}, 'ไม่อนุมัติ', '${l.รหัสประจำตัว}')">ไม่อนุมัติ</button>
                        </td>
                    </tr>
                `).join('');

                area.innerHTML = `
                    <div class="card p-4">
                        <h3 class="text-primary mb-3">พิจารณาคำขอเลื่อนยศ (เฉพาะผู้อำนวยการ)</h3>
                        <div class="table-responsive">
                            <table class="table table-bordered small align-middle">
                                <thead class="table-dark"><tr><th>รหัสประจำตัว</th><th>ยศที่ขอ</th><th>ผู้เสนอ / เหตุผล</th><th>ดำเนินการพิจารณา</th></tr></thead>
                                <tbody>${rows || '<tr><td colspan="4" class="text-center">ไม่มีรายการรออนุมัติ</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if(page === 'approve_names') {
                showLoading(true);
                const logs = await callGAS('getNameLogs');
                showLoading(false);

                let pending = getPendingLogs(logs);
                let rows = pending.map(l => `
                    <tr>
                        <td>${l.รหัสประจำตัว}</td>
                        <td><span class="fw-bold text-success">${l.ชื่อที่ตั้งใหม่}</span></td>
                        <td>${l.ผู้เสนอ || '-'} (${l.ตำแหน่งผู้เสนอ || '-'})<br><small class="text-muted">เหตุผล: ${l.ความคิดเห็นผู้เสนอ || '-'}</small></td>
                        <td>
                            <input type="text" id="name-comment-${l.rowIdx}" class="form-control form-control-sm mb-1" placeholder="ความคิดเห็นผู้อำนวยการ">
                            <button class="btn btn-sm btn-success fw-bold me-1" onclick="processName(${l.rowIdx}, 'อนุมัติ', '${l.รหัสประจำตัว}', '${l.ชื่อที่ตั้งใหม่}')">อนุมัติ</button>
                            <button class="btn btn-sm btn-danger fw-bold" onclick="processName(${l.rowIdx}, 'ไม่อนุมัติ', '${l.รหัสประจำตัว}', '${l.ชื่อที่ตั้งใหม่}')">ไม่อนุมัติ</button>
                        </td>
                    </tr>
                `).join('');

                area.innerHTML = `
                    <div class="card p-4">
                        <h3 class="text-primary mb-3">พิจารณาคำขอเปลี่ยนชื่อ (เฉพาะผู้อำนวยการ)</h3>
                        <div class="table-responsive">
                            <table class="table table-bordered small align-middle">
                                <thead class="table-dark"><tr><th>รหัสประจำตัว</th><th>ชื่อใหม่ที่ขอ</th><th>ผู้เสนอ / เหตุผล</th><th>ดำเนินการพิจารณา</th></tr></thead>
                                <tbody>${rows || '<tr><td colspan="4" class="text-center">ไม่มีรายการรออนุมัติเปลี่ยนชื่อ</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }

        async function updateAccount() {
            let u = document.getElementById('new-username').value.trim();
            let p = document.getElementById('new-password').value.trim();
            showLoading(true);
            const res = await callGAS('updateCredentials', { userId: currentUser.id, newUsername: u, newPassword: p });
            showLoading(false);
            alert(res.message);
            if(res.success) { 
                currentUser.username = u; 
                localStorage.setItem('chat_user', JSON.stringify(currentUser));
            }
        }

        async function processRank(rowIdx, status, userId) {
            let newRank = document.getElementById(`new-rank-${rowIdx}`).value;
            let comment = document.getElementById(`comment-${rowIdx}`).value;
            showLoading(true);
            const res = await callGAS('updateRankLogStatus', {
                rowIdx, status, approver: currentUser.username, approverPos: currentUser.role, comment, userId, newRank
            });
            showLoading(false);
            alert(res.message);
            showPage('approve_ranks', false);
        }

        async function processName(rowIdx, status, userId, newName) {
            let comment = document.getElementById(`name-comment-${rowIdx}`).value;
            showLoading(true);
            const res = await callGAS('updateNameLogStatus', {
                rowIdx, status, approver: currentUser.username, approverPos: currentUser.role, comment, userId, newName
            });
            showLoading(false);
            alert(res.message);
            showPage('approve_names', false);
        }
    </script>
</body>
</html>
